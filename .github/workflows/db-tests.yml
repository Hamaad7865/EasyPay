name: db-tests

# The database suites, on a throwaway copy of production: every migration is
# applied to it first, so this is also the rehearsal of a release's
# migrations before they are applied for real.
#
# Needs the repository secret NEON_API_KEY. Without it the job says so and
# passes: the checks that need no database are in ci.yml, and a missing key
# is not a broken build.
#
# It runs when started by hand (Actions, db-tests, Run workflow). On a push it
# runs only if the repository variable DB_TESTS_ON_PUSH is "yes": every run
# starts a database of its own for as long as the suites take, out of the
# same monthly hours production runs on, and this branch is pushed to many
# times a day. Never on pull requests: this repository is public, and a pull
# request from anyone must not be handed a key to the database.
#
# What a run costs: a little over an hour of a database at the smallest size
# (0.25 CU), so about 0.27 of the month's 100 compute hours. Measured on
# 2026-10-13: the 52 suites that finished took 44 minutes, 51 seconds each,
# with 19 more to go. GitHub's own minutes cost nothing while the repository
# is public.
#
# The suites run one at a time and must stay so on one copy. Most of them end
# with cleanupTenant, which locks every table that takes no change (the
# receipts' and the deliveries') for as long as it deletes; a suite of
# another client writing a receipt meanwhile waits behind it, or is the one
# a deadlock stops. And remove-test-clients counts every client in the
# database before and after ("one client fewer, no more"), which no other
# suite may be making or removing meanwhile. A copy for each group of suites
# is no way out: every copy is awake for its own share of the hour, and the
# plan allows ten branches, most of them taken (nine that day).
on:
  push:
  workflow_dispatch:

# A run started by hand and the runs of pushes are in groups of their own: a
# push joins its group even when its job is then skipped, and in one group
# with it a push to this branch would cancel the hour-long run started by
# hand.
concurrency:
  group: db-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DB_TESTS_ON_PUSH == 'yes' }}
    runs-on: ubuntu-latest
    # The suites need 60 to 70 minutes (see above); at 45 the run of
    # 2026-10-13 was stopped with 19 of the 71 to go. The rest is room for
    # the suites to come, about 50 seconds each. A suite that hangs is stopped
    # by its own limit, in the step that runs them.
    timeout-minutes: 90
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: snowy-fire-89764432
    steps:
      - name: is the key for Neon there
        id: key
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::warning::The repository secret NEON_API_KEY is not set, so the database suites were not run. Set it (Settings, Secrets and variables, Actions) to have every push rehearse the migrations on a copy of production."
            echo "have=no" >> "$GITHUB_OUTPUT"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.have == 'yes'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.have == 'yes'
        with:
          node-version: 24
      - if: steps.key.outputs.have == 'yes'
        run: npm ci --no-audit --no-fund
      # the suites that open a back office page, or run its own modules, compile them with the back office's packages
      - if: steps.key.outputs.have == 'yes'
        run: npm ci --no-audit --no-fund --prefix web
      - if: steps.key.outputs.have == 'yes'
        run: npm i -g neon@latest --no-audit --no-fund
      # Throwaway branch per job: copy-on-write from production, deleted
      # afterwards. Suites must still clean up after themselves (they do),
      # the branch is the second guard. Never run these against production.
      - name: create throwaway branch
        if: steps.key.outputs.have == 'yes'
        id: branch
        run: |
          NAME="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          neon branches create --project-id "$NEON_PROJECT_ID" --name "$NAME"
          CS="$(neon connection-string "$NAME" --project-id "$NEON_PROJECT_ID" --role-name neondb_owner | grep -o 'postgresql://[^ ]*' | head -1)"
          if [ -z "$CS" ]; then echo "could not read branch connection string"; exit 1; fi
          echo "::add-mask::$CS"
          echo "DATABASE_URL_UNPOOLED=$CS" >> "$GITHUB_ENV"
          # The pooled address too: helpers.test.cjs runs the API's and the back
          # office's own helpers, and they connect through the pooler as they do live.
          POOLED="$(neon connection-string "$NAME" --project-id "$NEON_PROJECT_ID" --role-name neondb_owner --pooled | grep -o 'postgresql://[^ ]*' | head -1)"
          if [ -z "$POOLED" ]; then echo "could not read branch pooled connection string"; exit 1; fi
          echo "::add-mask::$POOLED"
          echo "DATABASE_URL=$POOLED" >> "$GITHUB_ENV"
      - name: write test env
        if: steps.key.outputs.have == 'yes'
        run: |
          printf 'DATABASE_URL=%s\nDATABASE_URL_UNPOOLED=%s\nNEON_BRANCH=%s\n' "$DATABASE_URL" "$DATABASE_URL_UNPOOLED" "${{ steps.branch.outputs.name }}" > .env.local
      - if: steps.key.outputs.have == 'yes'
        run: node db/tests/guard.test.cjs
      # every migration production does not have, applied to its copy
      - name: migrations
        if: steps.key.outputs.have == 'yes'
        run: node db/migrate.cjs
      # Every suite that needs only the database, one at a time. Left out:
      # the ones that make real accounts on the sign-in service (api6,
      # signup-lock, platform-auth) and the ones that call a deployed till API
      # (api-shop-gate, api-till-activity, api-till-key, api-guest-pass,
      # api-tablet-code): a throwaway branch has neither. truncate runs last:
      # it empties every table of the branch.
      #
      # The longest suite takes a little over three minutes here. One still
      # running after ten is stopped and counted as failed (its output ends
      # with timeout's own line saying so), so that a suite that hangs costs
      # ten minutes of the database, not the rest of the job's limit.
      - name: suites
        if: steps.key.outputs.have == 'yes'
        run: |
          skip=" guard truncate api6 signup-lock platform-auth api-shop-gate api-till-activity api-till-key api-guest-pass api-tablet-code "
          failed=""
          for f in db/tests/*.test.cjs; do
            s=$(basename "$f" .test.cjs)
            case "$skip" in *" $s "*) continue;; esac
            echo "::group::$s"
            if timeout -v -k 10s 10m node "$f"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::$s failed"; failed="$failed $s"; fi
          done
          echo "::group::truncate"
          timeout -v -k 10s 10m node db/tests/truncate.test.cjs || failed="$failed truncate"
          echo "::endgroup::"
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - name: delete throwaway branch
        if: always() && steps.key.outputs.have == 'yes' && steps.branch.outputs.name != ''
        run: neon branches delete "${{ steps.branch.outputs.name }}" --project-id "$NEON_PROJECT_ID"
